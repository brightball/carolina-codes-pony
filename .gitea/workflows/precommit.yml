# First-stage prepare job clones GITHUB_SHA and installs quality-gate tools
# once, then exports that tree as a Gitea artifact. Check jobs restore it
# and run only their command. They do not re-clone or re-install.
#
# Empty runner image: clone GITHUB_SHA with the job token over HTTPS.
# Gitea git HTTP returns 401 without the token. Do not initialize a new
# repository or set a default-branch git config here. The five checks
# need prepare only (not each other).
#
# Artifacts are uploaded with curl against Gitea's artifact API. The
# ponyc:0.71.0 Alpine image has no Node (JS upload-artifact would fail)
# and the job token cannot publish OCI packages. Prepare and the checks
# share that image family so restored musl binaries run.
name: precommit

on:
  push:
  pull_request:

concurrency:
  group: precommit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ github.token }}

# Shared restore step. Not a job. YAML anchor so check jobs do not each
# re-clone or apk-add; they download the prepared-env artifact.
x-restore-prepared-env: &restore-prepared-env
  run: |
    set -euo pipefail
    token="${GITHUB_TOKEN:-${GITEA_TOKEN:-}}"
    if [ -z "$token" ]; then echo "missing job token" >&2; exit 1; fi
    out=/tmp/ci-env.sh
    api="${GITHUB_SERVER_URL%/}/api/v1/repos/${GITHUB_REPOSITORY}/raw/scripts/ci-env.sh?ref=${GITHUB_SHA}"
    if ! curl -fsSL -H "Authorization: token ${token}" "$api" -o "$out" || ! grep -q cmd_restore "$out"; then
      host="${GITHUB_SERVER_URL#https://}"
      host="${host#http://}"
      scheme=https
      case "${GITHUB_SERVER_URL}" in http://*) scheme=http ;; esac
      curl -fsSL "${scheme}://x-access-token:${token}@${host}/${GITHUB_REPOSITORY}/raw/commit/${GITHUB_SHA}/scripts/ci-env.sh" -o "$out"
    fi
    grep -q cmd_restore "$out"
    sh /tmp/ci-env.sh restore

jobs:
  prepare:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ponylang/ponyc:0.71.0
      options: --user root
      env:
        GITHUB_TOKEN: ${{ github.token }}
    steps:
      - run: |
          token="${GITHUB_TOKEN:-${GITEA_TOKEN:-}}"
          if [ -z "$token" ]; then echo "missing job token for git fetch" >&2; exit 1; fi
          host="${GITHUB_SERVER_URL#https://}"
          host="${host#http://}"
          git clone --depth 1 --no-checkout "https://x-access-token:${token}@${host}/${GITHUB_REPOSITORY}" .
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD
      - run: sh scripts/ci-env.sh prepare

  test:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ponylang/ponyc:0.71.0
      options: --user root
      env:
        GITHUB_TOKEN: ${{ github.token }}
    steps:
      - *restore-prepared-env
      - run: make test

  sast:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ponylang/ponyc:0.71.0
      options: --user root
      env:
        GITHUB_TOKEN: ${{ github.token }}
    steps:
      - *restore-prepared-env
      - run: make sast

  audit:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ponylang/ponyc:0.71.0
      options: --user root
      env:
        GITHUB_TOKEN: ${{ github.token }}
    steps:
      - *restore-prepared-env
      - run: make audit

  gitleaks:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ponylang/ponyc:0.71.0
      options: --user root
      env:
        GITHUB_TOKEN: ${{ github.token }}
    steps:
      - *restore-prepared-env
      - run: make gitleaks

  pony-lint:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ponylang/ponyc:0.71.0
      options: --user root
      env:
        GITHUB_TOKEN: ${{ github.token }}
    steps:
      - *restore-prepared-env
      - run: make lint

  smoke:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ponylang/ponyc:0.71.0
      options: --user root
      env:
        GITHUB_TOKEN: ${{ github.token }}
    steps:
      - *restore-prepared-env
      - run: make smoke
