# One Gitea Actions job per quality-gate check. Not a single combined job.
#
# Empty images: clone GITHUB_SHA with the job token over HTTPS.
# Gitea git HTTP returns 401 without the token. Do not create a fresh
# repo, force a default branch, or use the GitHub checkout action.
name: precommit

on:
  push:
  pull_request:

concurrency:
  group: precommit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ponylang/ponyc:0.71.0
      options: --user root
      env:
        GITHUB_TOKEN: ${{ github.token }}
    steps:
      - run: apk add --no-cache git openssl-dev libpq-dev ca-certificates make
      - run: |
          token="${GITHUB_TOKEN:-${GITEA_TOKEN:-}}"
          if [ -z "$token" ]; then echo "missing job token for git fetch" >&2; exit 1; fi
          host="${GITHUB_SERVER_URL#https://}"
          host="${host#http://}"
          git clone --depth 1 --no-checkout "https://x-access-token:${token}@${host}/${GITHUB_REPOSITORY}" .
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD
      - run: make test

  sast:
    runs-on: ubuntu-latest
    container:
      image: docker.io/semgrep/semgrep:latest
      env:
        GITHUB_TOKEN: ${{ github.token }}
    steps:
      - run: |
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache git make
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y --no-install-recommends git make ca-certificates
          fi
      - run: |
          token="${GITHUB_TOKEN:-${GITEA_TOKEN:-}}"
          if [ -z "$token" ]; then echo "missing job token for git fetch" >&2; exit 1; fi
          host="${GITHUB_SERVER_URL#https://}"
          host="${host#http://}"
          git clone --depth 1 --no-checkout "https://x-access-token:${token}@${host}/${GITHUB_REPOSITORY}" .
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD
      - run: make sast

  audit:
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/python:3.12-bookworm
      env:
        GITHUB_TOKEN: ${{ github.token }}
    steps:
      - run: apt-get update -qq && apt-get install -y --no-install-recommends git ca-certificates make curl
      - run: |
          curl -sSfL "https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64" -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner
          osv-scanner --version
      - run: |
          token="${GITHUB_TOKEN:-${GITEA_TOKEN:-}}"
          if [ -z "$token" ]; then echo "missing job token for git fetch" >&2; exit 1; fi
          host="${GITHUB_SERVER_URL#https://}"
          host="${host#http://}"
          git clone --depth 1 --no-checkout "https://x-access-token:${token}@${host}/${GITHUB_REPOSITORY}" .
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD
      - run: make audit

  gitleaks:
    runs-on: ubuntu-latest
    container:
      image: docker.io/zricethezav/gitleaks:v8.30.1
      options: --entrypoint /bin/sh --user root
      env:
        GITHUB_TOKEN: ${{ github.token }}
    steps:
      - run: |
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache git make bash
          fi
      - run: |
          token="${GITHUB_TOKEN:-${GITEA_TOKEN:-}}"
          if [ -z "$token" ]; then echo "missing job token for git fetch" >&2; exit 1; fi
          host="${GITHUB_SERVER_URL#https://}"
          host="${host#http://}"
          git clone --depth 1 --no-checkout "https://x-access-token:${token}@${host}/${GITHUB_REPOSITORY}" .
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD
      - run: make gitleaks

  pony-lint:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ponylang/ponyc:0.71.0
      options: --user root
      env:
        GITHUB_TOKEN: ${{ github.token }}
    steps:
      - run: apk add --no-cache git openssl-dev libpq-dev ca-certificates make
      - run: |
          token="${GITHUB_TOKEN:-${GITEA_TOKEN:-}}"
          if [ -z "$token" ]; then echo "missing job token for git fetch" >&2; exit 1; fi
          host="${GITHUB_SERVER_URL#https://}"
          host="${host#http://}"
          git clone --depth 1 --no-checkout "https://x-access-token:${token}@${host}/${GITHUB_REPOSITORY}" .
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD
      - run: make lint
